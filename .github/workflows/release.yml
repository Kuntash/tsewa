name: Validate and release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: canonical-release
  cancel-in-progress: false

jobs:
  validate-release:
    name: Validate and release canonical Tsewa
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.0.9
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm ready
      - name: Choose release tag
        id: release
        shell: bash
        run: |
          existing_tag="$(git tag --points-at "$GITHUB_SHA" --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n 1)"
          if [ -n "$existing_tag" ]; then
            tag="$existing_tag"
          else
            latest_tag="$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n 1)"
            if [ -z "$latest_tag" ]; then
              tag="v0.1.0"
            else
              version="${latest_tag#v}"
              IFS=. read -r major minor patch <<< "$version"
              tag="v${major}.${minor}.$((patch + 1))"
            fi
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag --annotate "$tag" --message "Tsewa $tag" "$GITHUB_SHA"
            git push origin "$tag"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists; leaving it unchanged."
          else
            gh release create "$RELEASE_TAG" --generate-notes --verify-tag --title "Tsewa $RELEASE_TAG"
          fi
